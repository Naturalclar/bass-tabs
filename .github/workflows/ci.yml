name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR makes the in-flight run obsolete; don't burn a runner on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Before setup-node: its `cache: pnpm` asks pnpm where the store lives, so
      # pnpm has to be on PATH by then. The version comes from packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      # oxlint does not cover type-informed checks; tsc fills that layer.
      - run: pnpm typecheck
      # `pnpm build` would re-run typecheck; the step above already did it.
      - run: pnpm exec vite build

  # Printing is what this app is for, and neither oxlint nor tsc can see it:
  # the page count comes from OSMD's pagination and the paper size from CSS the
  # printer resolves. This job builds, serves, and prints to PDF for real.
  print:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      # Before setup-node: its `cache: pnpm` asks pnpm where the store lives, so
      # pnpm has to be on PATH by then. The version comes from packageManager.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # @playwright/test is pinned exactly so this build matches the browser the
      # suite was measured against.
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:print
      - if: failure()
        uses: actions/upload-artifact@v5
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
