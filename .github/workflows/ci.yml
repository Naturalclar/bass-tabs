name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to the same PR makes the in-flight run obsolete; don't burn a runner on it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      # oxlint does not cover type-informed checks; tsc fills that layer.
      - run: npm run typecheck
      # `npm run build` would re-run typecheck; the step above already did it.
      - run: npx vite build
